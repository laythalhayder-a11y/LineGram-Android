name: Build LineGram APK

# Starts by itself after every push to main, or by hand:
# GitHub -> Actions -> "Build LineGram APK" -> Run workflow.
# Results:
#   * the APK under Releases on the repository page (only when the Telegram API keys are set)
#   * the same APK under "Artifacts" at the bottom of the run page
#   * the build log of the last run on the build-logs branch
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      cpu:
        description: "CPU types inside the APK"
        type: choice
        default: "arm64 only - phones from about 2017 on, fastest build"
        options:
          - "arm64 only - phones from about 2017 on, fastest build"
          - "all four - also old 32-bit phones and emulators, slow build, large APK"

permissions:
  contents: write   # publish the APK as a release and save the build log on the build-logs branch

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    env:
      TG_API_ID: ${{ secrets.TG_API_ID }}
      TG_API_HASH: ${{ secrets.TG_API_HASH }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      CPU_CHOICE: ${{ inputs.cpu || 'arm64 only' }}
      NDK_VERSION: "27.2.12479018"

    steps:
      - name: Get the project
        uses: actions/checkout@v4

      - name: Check the Telegram API keys
        id: keys
        run: |
          # Keys come from the repository secrets TG_API_ID / TG_API_HASH, or from gradle.properties.
          id="${TG_API_ID:-$(grep -E '^TG_API_ID=' gradle.properties | head -n 1 | cut -d= -f2 | tr -d '[:space:]')}"
          hash="${TG_API_HASH:-$(grep -E '^TG_API_HASH=' gradle.properties | head -n 1 | cut -d= -f2 | tr -d '[:space:]')}"
          if [ -z "$id" ] || [ "$id" = "0" ] || [ -z "$hash" ]; then
            echo "KEYS=missing" >> "$GITHUB_ENV"
            echo "::warning::TG_API_ID / TG_API_HASH are missing. This run makes a TEST APK that cannot log in, and no release. Add both keys as repository secrets (Settings -> Secrets and variables -> Actions), then run the workflow again."
          else
            echo "KEYS=ok" >> "$GITHUB_ENV"
            echo "API keys found (api id has ${#id} digits)."
          fi

      - name: Free disk space on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          # keep only the NDK version this project uses
          if [ -d "$ANDROID_HOME/ndk" ]; then
            sudo find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name "$NDK_VERSION" -exec rm -rf {} + || true
          fi
          df -h /

      - name: NASM for the x86 parts (all-four build only)
        if: ${{ startsWith(env.CPU_CHOICE, 'all') }}
        run: sudo apt-get install -y nasm || (sudo apt-get update && sudo apt-get install -y nasm)

      - name: Download the third-party source folders
        id: fetch
        run: |
          chmod +x fetch_submodules.sh gradlew
          ./fetch_submodules.sh

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36, NDK 27.2 and CMake 3.22.1
        id: sdk
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;3.22.1"

      - name: Use your own signing key (only when the keystore secrets exist)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > TMessagesProj/config/release.keystore
          echo "Own signing key installed."

      - name: Build the APK
        id: build
        run: |
          set -o pipefail
          # point every NDK variable at the one version this project uses
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME" ANDROID_NDK="$ANDROID_NDK_HOME" ANDROID_NDK_LATEST_HOME="$ANDROID_NDK_HOME"
          args=(":TMessagesProj_App:assembleAfatRelease" "--stacktrace" "--console=plain")
          if [ "$KEYS" = "missing" ]; then
            # test values: the build can be checked, but this APK cannot log in
            args+=("-PTG_API_ID=1" "-PTG_API_HASH=00000000000000000000000000000000")
          else
            if [ -n "$TG_API_ID" ]; then args+=("-PTG_API_ID=$TG_API_ID"); fi
            if [ -n "$TG_API_HASH" ]; then args+=("-PTG_API_HASH=$TG_API_HASH"); fi
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            args+=("-PRELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD" "-PRELEASE_KEY_ALIAS=$KEY_ALIAS" "-PRELEASE_KEY_PASSWORD=$KEY_PASSWORD")
          fi
          case "$CPU_CHOICE" in
            all*) echo "Building for all four CPU types." ;;
            *)    args+=("-Pandroid.injected.build.abi=arm64-v8a"); echo "Building for arm64-v8a." ;;
          esac
          ./gradlew "${args[@]}" 2>&1 | tee build.log

      - name: Collect the APK
        id: collect
        run: |
          apk="$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -n 1)"
          if [ -z "$apk" ]; then
            echo "::error::The build finished without an APK file."
            exit 1
          fi
          version="$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          name="LineGram-$version.apk"
          if [ "$KEYS" = "missing" ]; then name="LineGram-$version-TEST-cannot-log-in.apk"; fi
          mkdir -p out
          cp "$apk" "out/$name"
          ls -lh out

      - name: Publish the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: LineGram-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Publish the APK as a release
        if: ${{ success() && env.KEYS == 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(grep -E '^APP_VERSION_NAME=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          gh release create "v$version-build$GITHUB_RUN_NUMBER" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LineGram $version (build $GITHUB_RUN_NUMBER)" \
            --notes "LineGram, an unofficial Telegram client, built from Telegram for Android $version. Needs Android 6.0 or newer. Download the .apk file below and open it on the phone."

      - name: Save the build log on the build-logs branch
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          OUTCOMES: "keys=${{ steps.keys.outcome }} fetch=${{ steps.fetch.outcome }} sdk=${{ steps.sdk.outcome }} build=${{ steps.build.outcome }} collect=${{ steps.collect.outcome }}"
        run: |
          set +e
          dir="$RUNNER_TEMP/build-log"
          mkdir -p "$dir"
          if [ -f build.log ]; then
            tail -c 30000000 build.log > "$dir/build.log"
          else
            echo "No build log: the job stopped before the Gradle build started." > "$dir/build.log"
          fi
          grep -n -E "error:|FAILED|What went wrong|Caused by|BUILD (SUCCESSFUL|FAILED)|fatal|CMake Error|ninja: build stopped" -A 4 "$dir/build.log" | tail -n 3000 > "$dir/errors.txt"
          {
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo "status: $JOB_STATUS"
            echo "keys:   ${KEYS:-unknown}"
            echo "cpu:    $CPU_CHOICE"
            echo "steps:  $OUTCOMES"
            echo "time:   $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            df -h /
            echo
            free -m
          } > "$dir/summary.txt"
          cd "$dir" || exit 0
          git init -q
          git checkout -q -b build-logs
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Build log: run $GITHUB_RUN_NUMBER ($JOB_STATUS)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs \
            || echo "::warning::Could not save the build log."
